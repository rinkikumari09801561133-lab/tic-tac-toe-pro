name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          elif [ -f app/package.json ]; then
            cd app && npm install
          else
            echo "package.json not found in root or app folder"
            ls -la
          fi
          
      - name: Build Web
        run: |
          if [ -f package.json ]; then
            npm run build
          elif [ -f app/package.json ]; then
            cd app && npm run build
          fi
          
      - name: Create Keystore
        run: |
          keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass myStorePass123 -keypass myKeyPass123 -dname "CN=Test, OU=Test, O=Test, L=Test, S=Test, C=US"
          
      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: myStorePass123
          KEY_PASSWORD: myKeyPass123
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease
          elif [ -f ./android/gradlew ]; then
            cd android
            chmod +x ./gradlew
            ./gradlew assembleRelease
          elif [ -f ./app/android/gradlew ]; then
            cd app/android
            chmod +x ./gradlew
            ./gradlew assembleRelease
          else
            echo "gradlew not found"
            find . -name "gradlew" -type f
          fi
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            **/build/outputs/apk/release/*.apk
            **/app/build/outputs/apk/release/*.apk
