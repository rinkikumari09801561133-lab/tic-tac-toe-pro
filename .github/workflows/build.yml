name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Web Dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build || echo "web build skipped"
          elif [ -f app/package.json ]; then
            cd app
            npm ci
            npm run build || echo "web build skipped"
          else
            echo "No package.json found. Skipping Node build."
          fi

      - name: Setup Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app/src/main app/src/release app/src/debug
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo '{"project_info":{"project_number":"123456789","project_id":"dummy","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:abc","android_client_info":{"package_name":"com.example"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi
          cp app/google-services.json app/src/main/google-services.json || true
          cp app/google-services.json app/src/release/google-services.json || true
          cp app/google-services.json app/src/debug/google-services.json || true
          cp app/google-services.json google-services.json || true

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          pwd
          ls -la
          mkdir -p app
          # Clean old
          rm -f my-upload-key.jks app/my-upload-key.jks app/release.jks
          
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          else
            keytool -genkey -v -keystore my-upload-key.jks -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass myStorePass123 -keypass myKeyPass123 -dname "CN=Test, OU=Test, O=Test, L=Patna, S=Bihar, C=IN"
          fi
          
          # Copy to everywhere gradle might look
          cp my-upload-key.jks app/my-upload-key.jks
          cp my-upload-key.jks app/release.jks || true
          
          # Create key.properties with ABSOLUTE PATH - This is the fix
          PWD_PATH=$(pwd)
          echo "storeFile=$PWD_PATH/my-upload-key.jks" > app/key.properties
          echo "storePassword=${STORE_PASSWORD:-myStorePass123}" >> app/key.properties
          echo "keyPassword=${KEY_PASSWORD:-myKeyPass123}" >> app/key.properties
          echo "keyAlias=${KEY_ALIAS:-upload}" >> app/key.properties
          
          cat app/key.properties
          ls -lh my-upload-key.jks app/my-upload-key.jks

      - name: Build Release APK
        run: |
          find . -maxdepth 4 -name "gradlew" -type f
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleRelease --stacktrace
          elif [ -f ./app/gradlew ]; then
            chmod +x ./app/gradlew
            ./app/gradlew :app:assembleRelease --stacktrace
          elif [ -f ./android/gradlew ]; then
            cd android && chmod +x ./gradlew && ./gradlew :app:assembleRelease --stacktrace
          else
            echo "gradlew not found"; ls -la; exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Pro-APK
          path: |
            app/build/outputs/apk/release/*.apk
            build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
