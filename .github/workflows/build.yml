name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node (only if project uses it)
        if: ${{ hashFiles('package.json') != '' || hashFiles('app/package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies (if any)
        run: |
          if [ -f package.json ]; then npm install --no-audit --no-fund || true; npm run build || true; fi
          if [ -f app/package.json ]; then cd app && npm install --no-audit --no-fund || true; npm run build || true; fi

      - name: Ensure google-services.json exists
        run: |
          mkdir -p app/src/main
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"123","project_id":"dummy","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:abc","android_client_info":{"package_name":"com.example"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi
          cp -f app/google-services.json app/src/main/google-services.json || true

      - name: Create Debug Keystore (root + app + src/debug)
        run: |
          mkdir -p app/src/debug
          rm -f debug.keystore app/debug.keystore app/src/debug/debug.keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp -f debug.keystore app/debug.keystore
          cp -f debug.keystore app/src/debug/debug.keystore
          ls -lh debug.keystore app/debug.keystore app/src/debug/debug.keystore || true
          echo "--- signingConfigs in app/build.gradle ---"
          grep -n -A6 "signingConfigs" app/build.gradle || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; echo "gradlew found"; else echo "no gradlew, will use system gradle"; fi

      - name: Build Debug APK
        run: |
          ARGS=":app:assembleDebug --no-daemon --stacktrace --no-configuration-cache -x lint -x lintDebug"
          if [ -f ./gradlew ]; then
            ./gradlew $ARGS
          else
            gradle $ARGS
          fi

      - name: Find and copy APK
        if: ${{ always() }}
        run: |
          echo "----- APK files found -----"
          find . -name "*.apk" -type f | tee apk-list.txt
          mkdir -p out
          find . -name "*.apk" -type f -exec cp {} out/ \;
          ls -la out

      - name: Upload APK
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: CityRunner3D-APK
          path: out/*.apk
          if-no-files-found: warn
          
