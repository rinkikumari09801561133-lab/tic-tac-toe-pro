name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm install
          elif [ -f app/package.json ]; then cd app && npm install
          fi
          
      - name: Build Web
        run: |
          if [ -f package.json ]; then npm run build || echo "build skip"
          elif [ -f app/package.json ]; then cd app && npm run build || echo "build skip"
          fi

      - name: Create dummy google-services.json
        run: |
          echo '{"project_info":{"project_number":"123456","project_id":"dummy","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:abc","android_client_info":{"package_name":"com.example"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          cp app/google-services.json google-services.json || true
          mkdir -p app/app
          cp app/google-services.json app/app/google-services.json || true

      - name: Create Keystore
        run: |
          rm -f my-upload-key.jks app/my-upload-key.jks android/my-upload-key.jks app/android/my-upload-key.jks
          keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass myStorePass123 -keypass myKeyPass123 -dname "CN=Test, OU=Test, O=Test, L=Test, S=Test, C=US"
          cp my-upload-key.jks app/my-upload-key.jks || true
          cp my-upload-key.jks android/app/my-upload-key.jks || true
          mkdir -p app/android/app
          cp my-upload-key.jks app/android/app/my-upload-key.jks || true
          ls -lh *.jks **/*.jks || true
          
      - name: Build APK
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: myStorePass123
          KEY_PASSWORD: myKeyPass123
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; ./gradlew assembleRelease --stacktrace
          elif [ -f ./android/gradlew ]; then cd android; chmod +x ./gradlew; ./gradlew assembleRelease --stacktrace
          elif [ -f ./app/android/gradlew ]; then cd app/android; chmod +x ./gradlew; ./gradlew assembleRelease --stacktrace
          else find . -name "gradlew" -type f; fi
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            **/build/outputs/apk/release/*.apk
