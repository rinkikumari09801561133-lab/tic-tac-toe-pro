name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./tic-tac-toe-pro
        run: npm install

      - name: Build Web
        working-directory: ./tic-tac-toe-pro
        run: npm run build

      - name: Create Keystore
        working-directory: ./tic-tac-toe-pro
        run: |
          keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass myStorePass123 -keypass myKeyPass123 -dname "CN=Test, OU=Test, O=Test, L=Test, S=Test, C=US"

      - name: Build APK
        working-directory: ./tic-tac-toe-pro
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/tic-tac-toe-pro/my-upload-key.jks
          STORE_PASSWORD: myStorePass123
          KEY_PASSWORD: myKeyPass123
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --stacktrace
          else
            cd android
            chmod +x ./gradlew
            ./gradlew assembleRelease --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            tic-tac-toe-pro/app/build/outputs/apk/release/*.apk
            tic-tac-toe-pro/android/app/build/outputs/apk/release/*.apk
