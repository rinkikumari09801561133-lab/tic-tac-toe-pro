name: Build APK (100% Safe Debug Build)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node (optional)
        if: ${{ hashFiles('package.json') != '' || hashFiles('app/package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies (if any)
        run: |
          if [ -f package.json ]; then npm install --no-audit --no-fund || true; npm run build || true; fi
          if [ -f app/package.json ]; then cd app && npm install --no-audit --no-fund || true; npm run build || true; fi

      - name: Ensure google-services.json exists
        run: |
          mkdir -p app/src/main
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"123","project_id":"dummy","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:abc","android_client_info":{"package_name":"com.example"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi
          cp -f app/google-services.json app/src/main/google-services.json || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; echo "gradlew found"; else echo "no gradlew - will use system gradle"; fi

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Find and copy APK
        run: |
          echo "----- APK files found -----"
          find . -name "*.apk" -type f | tee apk-list.txt
          mkdir -p out
          find . -name "*.apk" -type f -exec cp {} out/ \;
          ls -la out

      - name: Upload APK
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: CityRunner3D-APK
          path: out/*.apk
          if-no-files-found: warn
          
