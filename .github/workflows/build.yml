name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Web Dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build || echo "web build skipped"
          elif [ -f app/package.json ]; then
            cd app
            npm ci
            npm run build || echo "web build skipped"
          else
            echo "No package.json found. Skipping Node build."
          fi

      - name: Setup Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          mkdir -p app/src/main
          mkdir -p app/src/release
          mkdir -p app/src/debug
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Using real GOOGLE_SERVICES_JSON from secrets"
          else
            echo '{"project_info":{"project_number":"123456789","project_id":"tic-tac-toe-pro-dummy","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:abcdef","android_client_info":{"package_name":"com.example.tic_tac_toe_pro"}},"oauth_client":[],"api_key":[{"current_key":"dummy-key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
            echo "Using dummy google-services.json for build"
          fi
          cp app/google-services.json app/src/main/google-services.json || true
          cp app/google-services.json app/src/release/google-services.json || true
          cp app/google-services.json app/src/debug/google-services.json || true
          cp app/google-services.json google-services.json || true

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/my-upload-key.jks
            echo "storePassword=${STORE_PASSWORD}" > app/key.properties
            echo "keyPassword=${KEY_PASSWORD}" >> app/key.properties
            echo "keyAlias=${KEY_ALIAS}" >> app/key.properties
            echo "storeFile=my-upload-key.jks" >> app/key.properties
            echo "Using keystore from secrets"
          else
            echo "No secrets found, generating new keystore..."
            rm -f app/my-upload-key.jks *.jks **/*.jks
            keytool -genkey -v -keystore app/my-upload-key.jks -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass myStorePass123 -keypass myKeyPass123 -dname "CN=Test, OU=Test, O=Test, L=Patna, S=Bihar, C=IN"
            echo "storePassword=myStorePass123" > app/key.properties
            echo "keyPassword=myKeyPass123" >> app/key.properties
            echo "keyAlias=upload" >> app/key.properties
            echo "storeFile=my-upload-key.jks" >> app/key.properties
          fi
          cat app/key.properties
          ls -lh app/*.jks || true

      - name: Build Release APK
        run: |
          chmod +x app/gradlew
          ./app/gradlew :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Pro-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
