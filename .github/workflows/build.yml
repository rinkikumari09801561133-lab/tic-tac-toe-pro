name: Build APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node if needed
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup release keystore
        run: |
          rm -f my-upload-key.jks app/my-upload-key.jks app/release.keystore
          keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass myStorePass123 -keypass myKeyPass123 -dname "CN=TicTacToe, OU=Dev, O=MyCompany, L=Patna, S=Bihar, C=IN"
          cp my-upload-key.jks app/my-upload-key.jks
          ls -lh my-upload-key.jks

      - name: Build Web if package.json exists
        run: |
          if [ -f package.json ]; then
            npm install
            npm run build || true
          fi

      - name: Build APK with Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble Release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: myStorePass123
          KEY_PASSWORD: myKeyPass123

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-APK
          path: app/build/outputs/apk/release/*.apk
