name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Web Dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build
          elif [ -f app/package.json ]; then
            cd app
            npm ci
            npm run build
          else
            echo "No package.json found. Skipping Node build."
          fi

      - name: Setup Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Firebase configuration missing!"
            exit 1
          fi

          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p app

          echo "$KEYSTORE_BASE64" | base64 --decode > app/my-upload-key.jks

          echo "storePassword=$STORE_PASSWORD" > app/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> app/key.properties
          echo "keyAlias=$KEY_ALIAS" >> app/key.properties
          echo "storeFile=my-upload-key.jks" >> app/key.properties

          echo "storePassword=$STORE_PASSWORD" > key.properties
          echo "keyPassword=$KEY_PASSWORD" >> key.properties
          echo "keyAlias=$KEY_ALIAS" >> key.properties
          echo "storeFile=app/my-upload-key.jks" >> key.properties

      - name: Build Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Pro-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
